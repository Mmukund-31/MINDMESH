server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://server:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # server-sent events (live run streams)
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /healthz {
    proxy_pass http://server:8000;
  }

  location / {
    try_files $uri /index.html;
  }
}
