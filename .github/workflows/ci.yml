name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.7"
      - run: ruff check --output-format=github .

  python-tests:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q

  studio:
    name: Studio (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  postgres:
    name: PostgreSQL + pgvector integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mindmesh
          POSTGRES_PASSWORD: mindmesh
          POSTGRES_DB: mindmesh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mindmesh -d mindmesh"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MINDMESH_TEST_DATABASE_URL: postgresql://mindmesh:mindmesh@localhost:5432/mindmesh
      MINDMESH_DATABASE_URL: postgresql://mindmesh:mindmesh@localhost:5432/mindmesh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,postgres]"

      - name: Migrate an empty database with the CLI
        run: |
          mindmesh db current && exit 1 || true   # behind before upgrading
          mindmesh db upgrade
          mindmesh db current

      - name: Integration tests (migrations, pgvector search, isolation, persistence)
        run: pytest -m postgres -v

      - name: Persistence across a database server restart
        run: |
          python -m tests.integration.pg_restart_check write
          docker restart "${{ job.services.postgres.id }}"
          for i in $(seq 1 30); do
            docker exec "${{ job.services.postgres.id }}" pg_isready -U mindmesh -d mindmesh && break
            sleep 1
          done
          python -m tests.integration.pg_restart_check verify

      - name: Production server refuses unsafe configuration
        env:
          MINDMESH_ENV: production
          MINDMESH_API_KEY: mm_dev_local_key_change_me
          MINDMESH_SECRET_KEY: ci-secret-0123456789-0123456789-0123456789
        run: |
          set +e
          timeout 20 mindmesh serve; code=$?
          test "$code" = 2 || { echo "expected exit 2, got $code"; exit 1; }

      - name: Production server on PostgreSQL enforces authentication
        env:
          MINDMESH_ENV: production
          MINDMESH_API_KEY: ci-api-key-0123456789-0123456789-0123
          MINDMESH_SECRET_KEY: ci-secret-0123456789-0123456789-0123456789
          MINDMESH_CORS_ORIGINS: https://studio.example.com
        run: |
          mindmesh serve --port 8000 > server.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/healthz | grep -q '"database":"postgresql"'
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(status -H "X-API-Key: $MINDMESH_API_KEY" http://127.0.0.1:8000/api/v1/me)" = 200
          test "$(status http://127.0.0.1:8000/api/v1/me)" = 401
          test "$(status "http://127.0.0.1:8000/api/v1/me?api_key=$MINDMESH_API_KEY")" = 401
          test "$(status http://127.0.0.1:8000/docs)" = 404
          kill "$pid"

      - if: failure()
        run: cat server.log || true

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.server -t mindmesh-server:ci .
      - run: docker build -t mindmesh-studio:ci studio
