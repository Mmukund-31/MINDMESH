# Alembic CLI configuration (development). The database URL comes from MINDMESH_DATABASE_URL.
#
#   alembic revision --autogenerate -m "add widgets"
#   alembic upgrade head          # or: mindmesh db upgrade
#
# Deployed images do not need this file: `mindmesh db upgrade` locates the migrations inside the package.

[alembic]
script_location = %(here)s/src/mindmesh/storage/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
path_separator = os

[post_write_hooks]
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
