[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mindmesh"
version = "0.1.0"
description = "The reliability and control plane for AI agents: memory, context engineering, policy enforcement, orchestration, tracing, replay and evaluation."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "MINDMESH contributors" }]
dependencies = [
  "pydantic>=2.9",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
postgres = ["psycopg[binary]>=3.2.10", "pgvector>=0.3.6"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mindmesh[server]",
]

[project.scripts]
mindmesh = "mindmesh.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mindmesh"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "postgres: requires the docker-compose Postgres (MINDMESH_TEST_DATABASE_URL)",
  "ollama: requires a running Ollama server",
]
addopts = "-m 'not postgres and not ollama'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008", "ASYNC109"]
